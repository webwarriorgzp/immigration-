<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Backdrop","default":"#E7DED3"},
  {"id":"color-body","type":"color","label":"Laptop body","default":"#5E5E64"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --color-ground: #e7ded3; --color-body: #5e5e64; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="121" data-width="1080" data-height="1920">
      <div id="vertical" data-composition-id="vertical" data-composition-src="compositions/vertical.html" data-start="0" data-duration="121" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="music" class="clip" src="assets/visit-tech-mix.m4a" data-start="0" data-duration="121" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
