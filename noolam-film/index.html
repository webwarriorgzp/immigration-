<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Background","default":"#FFFFFF"},
  {"id":"color-ink","type":"color","label":"Text","default":"#1D1B20"},
  {"id":"color-accent","type":"color","label":"Accent","default":"#C8102E"},
  {"id":"color-thread","type":"color","label":"Thread","default":"#C9A24A"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; font-weight: 600; src: url("assets/fonts/InterTight-600.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-weight: 600; src: url("assets/fonts/CormorantGaramond-600.woff2") format("woff2"); }
      :root {
        --color-ground: #ffffff;
        --color-ink: #1d1b20;
        --color-accent: #c8102e;
        --color-thread: #c9a24a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="silk" data-composition-id="silk" data-composition-src="compositions/silk.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="lineup" data-composition-id="lineup" data-composition-src="compositions/lineup.html" data-start="4.5" data-duration="10.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="weave" data-composition-id="weave" data-composition-src="compositions/weave.html" data-start="15" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="21" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
